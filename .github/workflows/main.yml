name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Briefcase
        run: |
          python -m pip install -U pip setuptools wheel
          python -m pip install briefcase

      - name: Setup Java
        run: |
          echo JAVA_HOME="${JAVA_HOME_17_X64:-$JAVA_HOME_17_arm64}" | tee -a "${GITHUB_ENV}"

      - name: Inject API key from secret
        run: |
          sed -i "s/PLACEHOLDER_API_KEY/${{ secrets.GROQ_API_KEY }}/" src/aiassistant/app.py

      - name: Build App
        run: briefcase build android gradle --no-input --log

      - name: Package APK
        run: briefcase package android gradle --no-input --log -p debug-apk --adhoc-sign

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: chatbot-apk
          path: dist
          if-no-files-found: error

      - name: Upload Log on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: logs/*
